<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="44" viewBox="0 0 1280 44" role="img" aria-labelledby="t d">
<title id="t">Разделитель</title><desc id="d">Неоновая линия: хаотичные письма слева проходят под Оком и выстраиваются в ровный поток справа.</desc>
<style>:root{--bg:#05060f;--gold:#ffb800;--cyan:#00f0ff;--magenta:#ff2bd6;--red:#ff1a1a;--muted:#1a2140}
.fb{fill:var(--bg)}.fg{fill:var(--gold)}.fc{fill:var(--cyan)}.fm{fill:var(--magenta)}.fr{fill:var(--red)}.fu{fill:var(--muted)}
.sg{stroke:var(--gold)}.sc{stroke:var(--cyan)}.sm{stroke:var(--magenta)}.sr{stroke:var(--red)}.su{stroke:var(--muted)}.sb{stroke:var(--bg)}
.nf{fill:none}
svg{stroke-linecap:round;stroke-linejoin:round}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono','Courier New',monospace;font-weight:700}
#still{display:none}
@media (prefers-reduced-motion:reduce){#live{display:none}#still{display:inline}}
</style>
