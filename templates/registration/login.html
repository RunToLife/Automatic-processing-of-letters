{% extends 'base.html' %}
{% block title %}Вход — Гендальф{% endblock %}
{% block content %}
<main class="login-wrap">
  <form method="post" class="card login">
    {% csrf_token %}
    <div class="logo">🧙</div>
    <h1>Гендальф</h1>
    <p class="muted">Обработка писем из сканов</p>
    {% if form.errors %}<div class="alert">Неверный логин или пароль.</div>{% endif %}
    <label>Логин<input name="username" autofocus autocomplete="username" required></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary wide" type="submit">Войти</button>
  </form>
</main>
{% endblock %}
